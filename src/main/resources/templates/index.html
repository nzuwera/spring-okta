<!-- src/main/resources/templates/index.html -->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        h1, h2 { font-family: 'DM Serif Display', serif; }

        .card {
          background: rgba(255,255,255,0.7);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
        }

        .blob {
          position: fixed;
          border-radius: 50%;
          filter: blur(80px);
          opacity: 0.35;
          pointer-events: none;
        }

        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(24px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        .fade-up { animation: fadeUp 0.6s ease both; }
        .fade-up-2 { animation: fadeUp 0.6s 0.15s ease both; }
        .fade-up-3 { animation: fadeUp 0.6s 0.3s ease both; }

        .avatar-ring {
          background: linear-gradient(135deg, #6366f1, #ec4899, #f59e0b);
          padding: 3px;
          border-radius: 9999px;
        }
        .avatar-ring img {
          border: 3px solid white;
          border-radius: 9999px;
          display: block;
        }

        .btn-primary {
          background: linear-gradient(135deg, #6366f1, #8b5cf6);
          transition: all 0.2s;
        }
        .btn-primary:hover {
          background: linear-gradient(135deg, #4f46e5, #7c3aed);
          transform: translateY(-1px);
          box-shadow: 0 8px 20px rgba(99,102,241,0.4);
        }

        .btn-ghost {
          transition: all 0.2s;
        }
        .btn-ghost:hover {
          background: rgba(99,102,241,0.08);
          transform: translateY(-1px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-50 relative overflow-hidden">

<!-- Decorative blobs -->
<div class="blob w-96 h-96 bg-indigo-400 top-[-80px] left-[-80px]"></div>
<div class="blob w-80 h-80 bg-pink-400 bottom-[-60px] right-[-60px]"></div>
<div class="blob w-64 h-64 bg-amber-300 top-1/2 left-1/3"></div>

<!-- ─── NOT logged in ─── -->
<div sec:authorize="!isAuthenticated()"
     class="card rounded-3xl shadow-2xl p-12 w-full max-w-md mx-4 text-center fade-up">

    <div class="mb-8">
        <div class="w-16 h-16 bg-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
            </svg>
        </div>
        <h1 class="text-3xl text-slate-800 mb-2">Welcome back</h1>
        <p class="text-slate-500 text-sm font-light">Sign in to continue to your account</p>
    </div>

    <a th:href="@{/oauth2/authorization/okta}"
       class="btn-primary inline-flex items-center gap-3 text-white font-medium px-8 py-3.5 rounded-xl w-full justify-center">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="12" cy="12" r="4"/>
        </svg>
        Continue with Okta
    </a>

    <p class="text-xs text-slate-400 mt-6">Secured by Okta &middot; OAuth 2.0</p>
</div>

<!-- ─── Logged in ─── -->
<div sec:authorize="isAuthenticated()"
     class="card rounded-3xl shadow-2xl p-10 w-full max-w-sm mx-4 text-center">

    <div class="fade-up mb-6">
        <div class="avatar-ring w-24 h-24 mx-auto mb-4">
            <img th:src="${profile.get('picture')}"
                 th:attr="alt=${profile.get('name')}"
                 class="w-full h-full object-cover" />
        </div>
        <h2 class="text-2xl text-slate-800 mb-1" th:text="${profile.get('name')}"></h2>
        <p class="text-slate-500 text-sm font-light" th:text="${profile.get('email')}"></p>
    </div>

    <div class="fade-up-2 inline-flex items-center gap-2 bg-emerald-50 text-emerald-700 text-xs font-medium px-3 py-1.5 rounded-full mb-8">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
        Authenticated
    </div>

    <div class="fade-up-3 space-y-3">
        <!-- Link-based logout (GET) -->
        <a th:href="@{/logout}"
           class="btn-ghost flex items-center justify-center gap-2 w-full border border-slate-200 text-slate-600 text-sm font-medium px-6 py-3 rounded-xl">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/>
            </svg>
            Sign out
        </a>

        <!-- POST-based logout form (CSRF-safe) -->
        <form name="logoutForm" th:action="@{/logout}" method="post">
            <button type="submit"
                    class="btn-ghost flex items-center justify-center gap-2 w-full border border-slate-200 text-slate-400 text-xs px-6 py-2.5 rounded-xl">
                Force logout (POST)
            </button>
        </form>
    </div>

</div>

</body>
</html>
